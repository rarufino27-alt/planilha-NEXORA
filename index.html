<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f4d">
  <meta name="description" content="Gerenciamento NEXORA — gerenciamento operacional do mercado financeiro.">
  <title>Gerenciamento NEXORA</title>
  <link rel="icon" href="assets/nexora-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/nexora-logo.png" alt="Nexora Gerenciamento">
        <div>
          <strong>GERENCIAMENTO</strong>
          <span>NEXORA</span>
        </div>
      </div>

      <div class="sidebar-nav-head">
        <span>MENU PRINCIPAL</span>
        <button class="sidebar-toggle" id="sidebar-toggle" title="Recolher menu" aria-label="Recolher menu">‹</button>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-label">Dashboard</span></button>
        <button class="nav-item" data-view="projection"><span class="nav-label">Projeções e Objetivos</span></button>
        <button class="nav-item" data-view="session"><span class="nav-label">Sessão Operacional</span></button>
        <button class="nav-item" data-view="operations"><span class="nav-label">Operações</span></button>
        <button class="nav-item" data-view="journal"><span class="nav-label">Diário Operacional</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-label">Configurações</span></button>
        <button class="nav-item" data-view="calculator"><span class="nav-label">Calculadora</span></button>
      </nav>

      <div class="sidebar-tools">
        <button class="sidebar-tool" id="export-sidebar">Exportar backup</button>
        <label class="sidebar-tool">Importar backup<input type="file" id="import-file" accept=".json"></label>
        <button class="sidebar-tool" id="theme-toggle">Modo escuro</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <div class="topbar-title">
          <p class="eyebrow">GERENCIAMENTO NEXORA</p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="top-actions">
          <button class="btn primary" data-view-target="session">+ Sessão operacional</button>
        </div>
      </header>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-session" class="view"></section>
      <section id="view-operations" class="view"></section>
      <section id="view-calculator" class="view"></section>
      <section id="view-projection" class="view"></section>
      <section id="view-journal" class="view"></section>
      <section id="view-performance" class="view"></section>
      <section id="view-capital" class="view"></section>
      <section id="view-assets" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
